[package]
name = "plumetxt"
version = "0.2.0"
edition = "2021"
description = "Lightweight native Windows Markdown editor and PDF reader"
license = "MIT"

[dependencies]
windows-core = "0.62"
portable-pty = "0.9"
vt100 = "0.16"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
lopdf = { version = "0.44", default-features = false }
memmap2 = "0.9"
windows = { version = "0.62", features = ["Data_Pdf", "Storage", "Storage_Streams", "Graphics_Imaging", "Foundation", "UI", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Controls_RichEdit", "Win32_Graphics_Imaging", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_SystemServices", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
